name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/wiki/package-lock.json

      - name: Configure git for clone/gitops tests
        run: |
          git config --global init.defaultBranch main
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"

      - name: Run go vet
        run: make vet

      - name: Run go test
        run: CGO_ENABLED=1 go test -tags "fts5" ./... -count=1

      - name: Prepare container artifacts
        run: make container-artifacts

      - name: Build production image
        run: |
          docker build \
            --build-arg TARGETARCH=amd64 \
            --tag ccg:ci .

      - name: Capture go build JSON
        run: make build-json

      - name: Check npm wrapper syntax
        run: |
          node --check npm/install.js
          node --check npm/bin/ccg.js
          node --check npm/bin/ccg-server.js

      - name: Upload go build JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-build-json
          path: build-results.json

  # The `postgres` build tag guards every test that needs a real PostgreSQL
  # server, including the backend parity test that is the only check that SQLite
  # and PostgreSQL answer a search the same way. The `verify` job above does not
  # pass that tag, so none of those files were ever compiled or run in CI. This
  # job is what makes them count.
  verify-postgres:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ccg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ccg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_DSN: host=localhost user=postgres password=postgres dbname=ccg_test port=5432 sslmode=disable
      # Without this the whole tagged suite calls t.Skip when the server is
      # missing and reports ok having exercised nothing. Setting it turns that
      # silence into a failure.
      REQUIRE_POSTGRES: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Configure git for clone/gitops tests
        run: |
          git config --global init.defaultBranch main
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"

      - name: Run go vet with the postgres tag
        run: CGO_ENABLED=1 go vet -tags "fts5,postgres" ./...

      # Packages run in parallel. Every postgres test takes its own schema from
      # internal/db/dbtest and names no other, so the -p 1 this step used to
      # carry is no longer needed. Putting it back would hide a test that
      # reaches outside its own schema instead of fixing it.
      - name: Run go test with the postgres tag
        run: CGO_ENABLED=1 go test -tags "fts5,postgres" ./... -count=1
